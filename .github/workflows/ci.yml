name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run notification tests
        working-directory: ./functions/notification
        run: mvn test -q

      - name: Run weekly report tests
        working-directory: ./functions/weekly-report
        run: mvn test -q
