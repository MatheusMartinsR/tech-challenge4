name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write   # obrigatório para o OIDC funcionar
  contents: read

jobs:
  deploy:
    name: Build e deploy (dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: corretto   # mesma distribuição usada pelo runtime java21 da AWS

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build
        run: sam build --parallel --cached

      # Os secrets entram como variáveis de ambiente e são usados entre aspas no comando
      - name: Deploy (dev)
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "Stage=dev \
               SenderEmail=$SENDER_EMAIL \
               RecipientEmails=$RECIPIENT_EMAILS \
               AlertEmail=$ALERT_EMAIL"
        # --config-env não é passado → usa [default] do samconfig.toml (stack tc4-dev)
