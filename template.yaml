AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Tech Challenge Fase 4 - plataforma de feedback de aulas (Grupo 35)

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
    Description: Ambiente. Cada stage é implantado como uma stack separada.
  SenderEmail:
    Type: String
    Default: not-configured@example.com
    Description: Remetente verificado no SES, usado pelas funções de notificação e de relatório.
  RecipientEmails:
    Type: String
    Default: not-configured@example.com
    Description: Administradores que recebem os feedbacks críticos, separados por vírgula. No sandbox do SES, todos precisam estar verificados.
  AlertEmail:
    Type: String
    Default: ''
    Description: E-mail inscrito no tópico de alertas operacionais (opcional). A AWS envia um e-mail de confirmação da inscrição.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [7, 14, 30, 60, 90]

Conditions:
  IsProd: !Equals [!Ref Stage, prod]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Globals:
  Function:
    Runtime: java21
    Architectures: [x86_64]
    MemorySize: 512
    Timeout: 20
    # SnapStart reduz o cold start do Java; exige versões publicadas (alias "live")
    AutoPublishAlias: live
    SnapStart:
      ApplyOn: PublishedVersions
    Environment:
      Variables:
        STAGE: !Ref Stage
  Api:
    # Evita o stage extra "Stage" que o SAM cria por padrão
    OpenApiVersion: '3.0.1'

Resources:

  # ---------------------------------------------------------------------------
  # Banco de dados
  # ---------------------------------------------------------------------------

  # Chave proposta em docs/proposta-chave-dynamodb.md (pk = DAY#<data>, sk = <timestamp>#<id>)
  # Criptografia em repouso: padrão do DynamoDB (chave da AWS, sem custo)
  # TODO (Issue #2 - banco): confirmar a chave com o grupo e avaliar PITR (backup contínuo)
  FeedbackTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub tc4-${Stage}-feedbacks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      DeletionProtectionEnabled: !If [IsProd, true, false]

  # ---------------------------------------------------------------------------
  # Eventos: ingestão -> SNS -> SQS -> notificação (falhas vão para a DLQ)
  # ---------------------------------------------------------------------------

  CriticalFeedbackTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub tc4-${Stage}-critical-feedback
      KmsMasterKeyId: alias/aws/sns

  # Fluxo de falha: a função devolve a mensagem em batchItemFailures, ela volta a ficar visível
  # após o VisibilityTimeout e é tentada de novo; na 3ª falha (maxReceiveCount) vai para a DLQ.
  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub tc4-${Stage}-notification
      VisibilityTimeout: 120  # >= 6x o timeout da função, recomendação da AWS
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationDLQ.Arn
        maxReceiveCount: 3

  NotificationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub tc4-${Stage}-notification-dlq
      MessageRetentionPeriod: 1209600  # 14 dias, o máximo
      SqsManagedSseEnabled: true

  # Dispara assim que existir qualquer mensagem na DLQ (notificação que falhou 3 vezes)
  # e avisa o tópico de alertas ao entrar em ALARM e ao voltar para OK.
  NotificationDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub tc4-${Stage}-notification-dlq-not-empty
      AlarmDescription: Feedbacks críticos que não foram notificados após todas as tentativas. Investigar os logs da função de notificação e reprocessar a DLQ.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotificationDLQ.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  IngestionFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub tc4-${Stage}-ingestion-errors
      AlarmDescription: A função de ingestão falhou ao processar uma requisição ou não conseguiu persistir o feedback.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestionFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  NotificationFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub tc4-${Stage}-notification-errors
      AlarmDescription: A função de notificação falhou ao processar eventos críticos da fila.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref NotificationFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  WeeklyReportFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub tc4-${Stage}-weekly-report-errors
      AlarmDescription: A função de relatório semanal falhou durante a execução agendada.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WeeklyReportFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  FeedbackApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub tc4-${Stage}-api-5xx
      AlarmDescription: A API Gateway está respondendo com erros de servidor, indicando falha no processamento das requisições.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Ref FeedbackApi
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  NotificationFunctionLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub tc4-${Stage}-notification-latency-high
      AlarmDescription: A latência da função de notificação excedeu o limite esperado, indicando problema de processamento ou dependência externa.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref NotificationFunction
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 8000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub tc4-${Stage}-observability
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda errors",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${IngestionFunction}", {"stat": "Sum"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${NotificationFunction}", {"stat": "Sum"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${WeeklyReportFunction}", {"stat": "Sum"}]
                ],
                "period": 300,
                "region": "${AWS::Region}",
                "stacked": false,
                "view": "timeSeries",
                "stat": "Sum",
                "yAxis": { "left": { "min": 0 } }
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda duration (avg)",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${IngestionFunction}", {"stat": "Average"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${NotificationFunction}", {"stat": "Average"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${WeeklyReportFunction}", {"stat": "Average"}]
                ],
                "period": 300,
                "region": "${AWS::Region}",
                "stacked": false,
                "view": "timeSeries",
                "stat": "Average",
                "yAxis": { "left": { "min": 0 } }
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API Gateway 5xx errors",
                "metrics": [
                  ["AWS/ApiGateway", "5XXError", "ApiName", "${FeedbackApi}", "Stage", "${Stage}", {"stat": "Sum"}]
                ],
                "period": 300,
                "region": "${AWS::Region}",
                "stacked": false,
                "view": "timeSeries",
                "stat": "Sum",
                "yAxis": { "left": { "min": 0 } }
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Notification DLQ messages",
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${NotificationDLQ.QueueName}", {"stat": "Maximum"}]
                ],
                "period": 300,
                "region": "${AWS::Region}",
                "stacked": false,
                "view": "timeSeries",
                "stat": "Maximum",
                "yAxis": { "left": { "min": 0 } }
              }
            }
          ]
        }

  # ---------------------------------------------------------------------------
  # Alertas operacionais: alarmes do CloudWatch publicam aqui; inscrições por e-mail
  # ---------------------------------------------------------------------------

  # Sem criptografia com a chave gerenciada aws/sns: o CloudWatch não consegue publicar em tópicos
  # cifrados com ela, e uma chave KMS própria teria custo mensal. O conteúdo é só o estado do alarme.
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub tc4-${Stage}-alerts

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # Somente o tópico de feedback crítico pode enviar mensagens para a fila
  NotificationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref NotificationQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref CriticalFeedbackTopic

  CriticalFeedbackSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CriticalFeedbackTopic
      Protocol: sqs
      Endpoint: !GetAtt NotificationQueue.Arn
      RawMessageDelivery: true

  # ---------------------------------------------------------------------------
  # API Gateway: porta de entrada única, com API Key e limite de requisições
  # ---------------------------------------------------------------------------

  FeedbackApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub tc4-${Stage}-api
      StageName: !Ref Stage
      # O padrão de APIs edge-optimized é TLS_1_0. Esta política aceita só TLS 1.2 e 1.3, com
      # forward secrecy. Políticas "SecurityPolicy_*" exigem EndpointAccessMode; BASIC mantém o
      # roteamento atual (STRICT acrescenta proteção contra domain fronting e pode ser avaliado depois).
      SecurityPolicy: SecurityPolicy_TLS12_PFS_2025_EDGE
      EndpointAccessMode: BASIC
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
          UsagePlanName: !Sub tc4-${Stage}-usage-plan
          Throttle:
            RateLimit: 5
            BurstLimit: 10
          Quota:
            Limit: 1000
            Period: DAY
      # Payload inválido é rejeitado pelo API Gateway (400) sem invocar a função.
      # Os campos seguem o contrato do enunciado: { "descricao": string, "nota": int (0 a 10) }
      Models:
        EvaluationRequest:
          type: object
          required: [descricao, nota]
          properties:
            descricao:
              type: string
              minLength: 1
              maxLength: 1000
            nota:
              type: integer
              minimum: 0
              maximum: 10

  # ---------------------------------------------------------------------------
  # Função de ingestão: POST /avaliacao
  # ---------------------------------------------------------------------------

  IngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub tc4-${Stage}-ingestion
      CodeUri: functions/ingestion
      Handler: br.com.fiap.tc4.ingestion.IngestionHandler::handleRequest
      Role: !GetAtt IngestionRole.Arn
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref IngestionLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref FeedbackTable
          TOPIC_ARN: !Ref CriticalFeedbackTopic
      Events:
        PostEvaluation:
          Type: Api
          Properties:
            RestApiId: !Ref FeedbackApi
            Path: /avaliacao
            Method: post
            RequestModel:
              Model: EvaluationRequest
              Required: true
              ValidateBody: true

  IngestionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/tc4-${Stage}-ingestion
      RetentionInDays: !Ref LogRetentionDays

  IngestionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ingestion-least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt IngestionLogGroup.Arn
              - Sid: PutFeedback
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt FeedbackTable.Arn
              - Sid: PublishCriticalFeedback
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref CriticalFeedbackTopic

  # ---------------------------------------------------------------------------
  # Função de notificação: consome a fila e envia e-mail aos administradores
  # ---------------------------------------------------------------------------

  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub tc4-${Stage}-notification
      CodeUri: functions/notification
      Handler: br.com.fiap.tc4.notification.NotificationHandler::handleRequest
      Role: !GetAtt NotificationRole.Arn
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref NotificationLogGroup
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
          RECIPIENT_EMAILS: !Ref RecipientEmails
          TEMPLATE_NAME: !Ref CriticalFeedbackEmailTemplate
      Events:
        NotificationQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt NotificationQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]

  NotificationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/tc4-${Stage}-notification
      RetentionInDays: !Ref LogRetentionDays

  # Template do e-mail de feedback crítico (Issue de e-mail). {{campo}} é escapado pelo SES;
  # nunca usar {{{campo}}}, porque a descrição é texto livre do estudante.
  # Campos: descricao, nota, urgencia, dataEnvio e id (preenchidos pela função de notificação).
  CriticalFeedbackEmailTemplate:
    Type: AWS::SES::Template
    Properties:
      Template:
        TemplateName: !Sub tc4-${Stage}-critical-feedback
        SubjectPart: '[Feedback crítico] Urgência {{urgencia}} - nota {{nota}}'
        TextPart: |
          Um feedback crítico foi recebido na plataforma de avaliação de aulas.

          Descrição: {{descricao}}
          Nota: {{nota}}
          Urgência: {{urgencia}}
          Data de envio: {{dataEnvio}}
          ID: {{id}}
        HtmlPart: >-
          <html><body style="font-family:Arial,sans-serif"><h2 style="color:#b00020">Alerta: avaliação crítica de aula - Tech Challenge 4</h2><table cellpadding="6" style="border-collapse:collapse"><tr><td><b>Descrição</b></td><td>{{descricao}}</td></tr><tr><td><b>Nota</b></td><td>{{nota}}</td></tr><tr><td><b>Urgência</b></td><td>{{urgencia}}</td></tr><tr><td><b>Data de envio</b></td><td>{{dataEnvio}}</td></tr><tr><td><b>ID</b></td><td>{{id}}</td></tr></table><p style="color:#666;font-size:12px">Este é um e-mail enviado automaticamente pelo Tech Challenge 4.</p></body></html>

  # O recurso cobre as identidades da conta na região, não só o remetente, por precaução: no sandbox
  # os destinatários também são identidades verificadas e o SES pode conferir a permissão contra elas.
  # A condição ses:FromAddress mantém o envio restrito ao remetente configurado.
  NotificationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: notification-least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt NotificationLogGroup.Arn
              - Sid: ConsumeQueue
                Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt NotificationQueue.Arn
              - Sid: SendEmail
                Effect: Allow
                Action: ses:SendEmail
                Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*
                Condition:
                  StringEquals:
                    ses:FromAddress: !Ref SenderEmail
              # O envio com template é autorizado contra a identidade (acima) e contra o template
              - Sid: UseCriticalFeedbackTemplate
                Effect: Allow
                Action: ses:SendEmail
                Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:template/${CriticalFeedbackEmailTemplate}

  # ---------------------------------------------------------------------------
  # Função de relatório: executada toda segunda-feira às 08:00 (horário de Brasília)
  # ---------------------------------------------------------------------------

  WeeklyReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub tc4-${Stage}-weekly-report
      CodeUri: functions/weekly-report
      Handler: br.com.fiap.tc4.report.WeeklyReportHandler::handleRequest
      Role: !GetAtt WeeklyReportRole.Arn
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref WeeklyReportLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref FeedbackTable
          SENDER_EMAIL: !Ref SenderEmail
          REPORT_RECIPIENTS: !Ref RecipientEmails
      Events:
        WeeklySchedule:
          Type: ScheduleV2
          Properties:
            Name: !Sub tc4-${Stage}-weekly-report
            ScheduleExpression: cron(0 8 ? * MON *)
            ScheduleExpressionTimezone: America/Sao_Paulo

  WeeklyReportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/tc4-${Stage}-weekly-report
      RetentionInDays: !Ref LogRetentionDays

  WeeklyReportRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: weekly-report-least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt WeeklyReportLogGroup.Arn
              - Sid: QueryFeedbacks
                Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt FeedbackTable.Arn
              - Sid: SendEmail
                Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*
                Condition:
                  StringEquals:
                    ses:FromAddress: !Ref SenderEmail

Outputs:
  AlertsTopicArn:
    Description: Tópico de alertas operacionais (alarmes do CloudWatch)
    Value: !Ref AlertsTopic
  ApiUrl:
    Description: Endpoint POST /avaliacao
    Value: !Sub https://${FeedbackApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Stage}/avaliacao
  ApiKeyId:
    Description: "ID da API Key. Para ver o valor: aws apigateway get-api-key --api-key <id> --include-value"
    Value: !Ref FeedbackApiApiKey
  FeedbackTableName:
    Value: !Ref FeedbackTable
  NotificationQueueUrl:
    Value: !Ref NotificationQueue
  NotificationDLQUrl:
    Value: !Ref NotificationDLQ
